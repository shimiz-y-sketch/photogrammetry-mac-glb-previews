<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Preview Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ee;
      --panel: rgba(255, 252, 245, 0.92);
      --text: #1f1a14;
      --muted: #6e6255;
      --border: rgba(31, 26, 20, 0.12);
      --accent: #8d5a2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(141, 90, 43, 0.18), transparent 30%),
        linear-gradient(180deg, #f7f1e7 0%, var(--bg) 58%, #ece6dc 100%);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      padding: 20px 24px 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    main {
      padding: 0 24px 24px;
      display: grid;
      gap: 16px;
      grid-template-columns: minmax(0, 1fr);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 14px 40px rgba(31, 26, 20, 0.08);
      overflow: hidden;
    }

    .meta {
      padding: 16px 18px;
      display: grid;
      gap: 8px;
    }

    .meta strong {
      color: var(--accent);
    }

    .hint {
      font-size: 14px;
      color: var(--muted);
    }

    .meta a {
      color: #0b57d0;
      font-weight: 600;
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }

    model-viewer {
      width: 100%;
      height: min(72vh, 840px);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.75), transparent 40%),
        linear-gradient(180deg, #e9dfd0 0%, #d5c5b0 100%);
      display: none;
    }

    .message {
      padding: 28px 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      line-height: 1.7;
    }

    .message strong {
      color: var(--text);
    }

    code {
      font-family: "SFMono-Regular", "Menlo", "Monaco", monospace;
      font-size: 0.95em;
      background: rgba(31, 26, 20, 0.06);
      border-radius: 6px;
      padding: 0.15em 0.4em;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="page-title">Shared Preview Viewer</h1>
    <p>GitHub Pages 上の共通 viewer から、指定した run の <code>model.glb</code> を読み込みます。</p>
  </header>

  <main>
    <section class="panel">
      <div class="meta">
        <div><strong>run-id:</strong> <span id="run-id">N/A</span></div>
        <div><strong>model path:</strong> <span id="model-path">N/A</span></div>
        <div><strong>report:</strong> <a id="report-link" href="#" hidden>report.md を開く</a></div>
        <div class="hint">URL 例: <code>?run=260414_009</code></div>
      </div>
      <model-viewer
        id="viewer"
        camera-controls
        touch-action="pan-y"
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        loading="eager"
        alt="3D model preview">
      </model-viewer>
      <div class="message" id="message">
        <strong>run が指定されていません。</strong><br>
        URL に <code>?run=&lt;run-id&gt;</code> を付けてください。
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const runId = params.get("run");
    const pageTitle = document.getElementById("page-title");
    const runIdNode = document.getElementById("run-id");
    const modelPathNode = document.getElementById("model-path");
    const reportLink = document.getElementById("report-link");
    const viewer = document.getElementById("viewer");
    const message = document.getElementById("message");

    if (runId) {
      const modelPath = `../previews/${encodeURIComponent(runId)}/model.glb`;
      const reportPath = `../previews/${encodeURIComponent(runId)}/report.md`;
      const titledRunId = `Run ${runId}`;
      document.title = `${titledRunId} | Shared Preview Viewer`;
      pageTitle.textContent = titledRunId;
      runIdNode.textContent = runId;
      modelPathNode.textContent = modelPath;
      reportLink.href = reportPath;
      reportLink.hidden = false;
      viewer.src = modelPath;
      viewer.style.display = "block";
      message.innerHTML = `<strong>読み込み中...</strong><br>${modelPath}`;

      viewer.addEventListener("load", () => {
        message.innerHTML = `<strong>読み込み完了</strong><br>${modelPath}`;
      });

      viewer.addEventListener("error", () => {
        message.innerHTML = `<strong>読み込み失敗</strong><br>${modelPath} を開けませんでした。公開済み run-id か確認してください。`;
      });
    }
  </script>
</body>
</html>
